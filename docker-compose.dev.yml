# ---------------------------------------------------------------------------
# Development overlay: infrastructure only, plus a mail catcher.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Run the API and storefront on the host with hot reload:
#   cd backend  && npm run start:dev
#   cd frontend && npm run dev
# ---------------------------------------------------------------------------

name: boutique-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: boutique-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: boutique_dev_pw
      POSTGRES_DB: boutique_dev
    ports: ['5470:5432']
    volumes: ['postgres-dev-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boutique']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: boutique-redis
    restart: unless-stopped
    ports: ['6399:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Catches every outbound email so nothing reaches a real inbox in development.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: boutique-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'  # SMTP  -> set SMTP_HOST=localhost, SMTP_PORT=1025
      - '8025:8025'  # Web UI at http://localhost:8025

volumes:
  postgres-dev-data:
